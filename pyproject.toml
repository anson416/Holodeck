[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2holodeck"
version = "0.0.2"
description = "Holodeck: Language Guided Generation of 3D Embodied AI Environments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Allen Institute for AI", email = "lucaw@allenai.org" },
]
keywords = [
    "procedural generation",
    "home environments",
    "unity",
    "3d assets",
    "annotation",
    "3d",
    "ai2thor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core generation pipeline: LLM floor-plan/object-selection, CLIP+SBERT
# retrieval, geometry/placement, serialization. AI2-THOR is installed separately
# from the AI2 PyPI index (see [project.optional-dependencies].ai2thor).
dependencies = [
    "colorama",
    "compress-json",
    "compress-pickle",
    "cvxpy",
    "editdistance",
    "faust-cchardet",
    "moviepy==1.0.3",
    "numpy",
    "openai==1.66.3",
    "open_clip_torch==2.28.0",
    "pillow",
    "prior",
    "procthor",
    "rtree",
    "scipy",
    "sentence-transformers",
    "shapely",
    "torch==2.5.1",
    "torchvision",
    "transformers",
]

[project.optional-dependencies]
# Blender rendering (the --render / --render_all CLI flags). bpy ships its own
# bundled Python, so it is kept out of the core deps.
blender = [
    "bpy==5.1.2",
]
# AI2-THOR Unity executable. Not on PyPI; installed from the AI2 index:
#   pip install --extra-index-url https://ai2thor-pypi.allenai.org \
#       ai2thor==0+8524eadda94df0ab2dbb2ef5a577e4d37c712897
ai2thor = [
    "ai2thor==0+8524eadda94df0ab2dbb2ef5a577e4d37c712897",
]
# MILP placement solver (optional; DFS is the default).
milp = [
    "gurobipy==10.0.3",
]
# The Unity WSGI bridge (connect_to_unity.py).
server = [
    "Flask==2.0.1",
    "Werkzeug==2.0.1",
]
# Asset pipeline.
assets = [
    "objathor",
    "objaverse",
]
dev = [
    "black",
]

# Console entry points: the CLIs (cli.py, ai2holodeck/main.py) are run as
# `python cli.py ...` / `python ai2holodeck/main.py ...`; cli.py lives at the
# repo root and is intentionally not an installed package module.

[tool.setuptools]
packages = ["ai2holodeck", "ai2holodeck.generation"]

[tool.setuptools.package-data]
ai2holodeck = [
    "generation/*.json",
    "generation/*/*.json",
]

[tool.black]
line-length = 119
